apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: scp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scp-server
  template:
    metadata:
      labels:
        app: scp-server
    spec:
      containers:
      - name: scp-server
        image: docker.io/xsylla/scp-server:latest
        env:
        - name: ACCEPT_SCPSL_EULA
          value: "TRUE"
        ports:
        - name: udp
          containerPort: 7777
          protocol: UDP
        envFrom:
        - configMapRef:
            name: scp-config
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 1Gi
        volumeMounts:
        - name: scp-data
          mountPath: /data
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        imagePullPolicy: Always #we use the same image tag, so whenever I update that image, this will force pull it (yeah that's not the best practice but I'm just setting up a game server, nothing seriously)
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      schedulerName: default-scheduler
  volumeClaimTemplates:
  - kind: PersistentVolumeClaim
    apiVersion: v1
    metadata:
      name: scp-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
      storageClassName: local-path
      volumeMode: Filesystem
    status:
      phase: Pending
  serviceName: scp-server
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  revisionHistoryLimit: 10
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
